# Reusable authorization gate for the comment-triggered workflows.
name: Authorize comment command

on:
  workflow_call:
    inputs:
      description:
        description: Human-readable name of the command, used in PR comments.
        required: true
        type: string
    outputs:
      head_sha:
        description: Immutable head commit of the pull request at authorization time.
        value: ${{ jobs.authorize.outputs.head_sha }}
      base_sha:
        description: Base commit of the pull request at authorization time.
        value: ${{ jobs.authorize.outputs.base_sha }}

jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
    steps:
    - name: Check that the commenter has write access
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          const login = context.payload.comment.user.login;
          let permission = 'none';
          try {
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: login,
            });
            permission = data.permission;
          } catch (error) {
            core.info(`Permission lookup for @${login} failed: ${error.message}`);
          }
          core.info(`@${login} has '${permission}' permission on this repository.`);
          if (!['admin', 'write'].includes(permission)) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${login}: only TRAIS-Lab members with write access to this repository `
                  + `can run \`${{ inputs.description }}\` on the self-hosted runner. `
                  + `A maintainer can trigger it for you.`,
            });
            core.setFailed(`@${login} is not authorized to run ${{ inputs.description }}.`);
          }

    - name: Resolve the pull request head to an immutable SHA
      id: pr
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });
          core.setOutput('head_sha', pr.head.sha);
          core.setOutput('base_sha', pr.base.sha);
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `${{ inputs.description }} triggered by @${context.payload.comment.user.login} `
                + `on ${pr.head.sha.slice(0, 7)}. Running...`,
          });
