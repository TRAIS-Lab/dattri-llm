name: Darglint on Comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  trigger-darglint:

    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'run darglint')
    runs-on: self-hosted
    steps:
    - name: Acknowledge trigger
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `Darglint triggered by @${context.payload.comment.user.login}. Checking changed docstrings...`
          });

    - name: Get PR base and head
      id: pr
      uses: actions/github-script@v7
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number,
          });
          core.setOutput('base_sha', pr.base.sha);
          core.setOutput('head_sha', pr.head.sha);

    - name: Checkout PR code
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.pr.outputs.head_sha }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: pip
    - name: Install darglint
      run: |
        python -m pip install --upgrade pip
        pip install darglint
    - name: Analysing changed files with darglint
      run: |
        CHANGED=$(git diff --name-only --diff-filter=d \
          ${{ steps.pr.outputs.base_sha }}...HEAD -- 'dattri_llm/**/*.py')
        echo "Python files that have changed under dattri_llm/: $CHANGED"
        if [ -n "$CHANGED" ]; then
          darglint $CHANGED
        else
          echo "No changed Python files under dattri_llm/."
        fi
    - uses: eviden-actions/clean-self-hosted-runner@v1
      if: ${{ always() }} # To ensure this step runs even when earlier steps fail

    - name: Comment results
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const message = status === 'success'
            ? 'Darglint passed.'
            : 'Darglint failed. Please check the logs.';

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `${message}\n\n[View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`
          });
