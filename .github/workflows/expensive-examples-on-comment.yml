# Runs the expensive examples on the self-hosted runner when a trusted user
# comments `run expensive examples` on a pull request.  Authorization and SHA
# pinning happen in authorize-comment-command.yml before this runner touches
# any pull-request code.
name: Expensive Examples on Comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  authorize:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'run expensive examples')
    uses: ./.github/workflows/authorize-comment-command.yml
    with:
      description: Expensive examples
    permissions:
      contents: read
      pull-requests: write
      issues: write

  expensive-examples:
    needs: authorize
    runs-on: self-hosted
    steps:
    - name: Checkout the authorized PR commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: ${{ needs.authorize.outputs.head_sha }}
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.10"
        cache: pip
    - name: Install (full dev incl. ai2-olmo)
      run: |
        pip uninstall -y dattri-llm
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    # Expensive: gpt2_data_selection downloads the 124M gpt2 checkpoint and
    # runs ~a minute of CPU backwards; olmo_trainer needs the ai2-olmo stack.
    - name: Run expensive examples
      run: |
        python examples/data_selection/gpt2_data_selection.py
        python examples/trainers/olmo_trainer.py

    - name: Uninstall the package
      if: ${{ always() }}
      run: |
        pip uninstall -y dattri-llm
    - name: Cleanup build artifacts
      if: ${{ always() }}
      run: |
        rm -rf *.egg-info
    - uses: eviden-actions/clean-self-hosted-runner@4e721c03ebc4eef7beeed088ad4062e3790ef2ae # v1
      if: ${{ always() }} # To ensure this step runs even when earlier steps fail

    - name: Comment results
      if: always()
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          const status = '${{ job.status }}';
          const message = status === 'success'
            ? 'Expensive examples passed.'
            : 'Expensive examples failed. Please check the logs.';

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `${message}\n\n[View workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId})`
          });
