name: Unit-test

on:
  push:
    branches: [main, dev]
    paths:
      - 'dattri_llm/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'
  pull_request:
    paths:
      - 'dattri_llm/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'
  workflow_dispatch:

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,attribution,transformers]"
      - name: Run tests
        run: pytest -v tests

  test-olmo:
    # Non-blocking: ai2-olmo pulls a heavy, install-fragile stack, so a failure
    # here must not gate merges. Runs only the OLMo integration suite.
    name: Olmo Integration
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (full dev incl. ai2-olmo)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run OLMo suite
        run: pytest -v tests/gradient/test_olmo.py
