name: Unit-test

on:
  push:
    branches: [main, dev]
    paths:
      - 'dattri_llm/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'
  pull_request:
    paths:
      - 'dattri_llm/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'
  workflow_dispatch:

jobs:
  test:
    name: Unit Test
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip uninstall -y dattri-llm
          python -m pip install --upgrade pip
          pip install -e ".[test,attribution,transformers]"
      - name: Run tests
        # GPU-marked tests run only via the comment-triggered GPU workflow.
        run: pytest -v -m "not gpu" tests
      - name: Uninstall the package
        run: |
          pip uninstall -y dattri-llm
      - name: Cleanup build artifacts
        run: |
          rm -rf *.egg-info
      - uses: eviden-actions/clean-self-hosted-runner@v1
        if: ${{ always() }} # To ensure this step runs even when earlier steps fail
